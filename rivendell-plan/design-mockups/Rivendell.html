<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Rivendell — Council with Elrond</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="rivendell.css"/>
<style>
  /* View switcher tabs */
  .view-switch {
    position: fixed; top: 16px; right: 20px; z-index: 100;
    display: flex; gap: 4px;
    background: var(--r-bg-card); border: 1px solid var(--r-line);
    border-radius: 999px; padding: 3px;
  }
  .view-switch button {
    background: transparent; border: none; color: var(--r-ink-mute);
    padding: 6px 14px; border-radius: 999px; font-size: 12px;
    font-family: var(--r-body); cursor: pointer;
    letter-spacing: 0.04em;
  }
  .view-switch button.active {
    background: rgba(212,175,99,0.14); color: var(--r-gold);
  }
</style>
</head>
<body>
<div id="root"></div>

<div class="view-switch">
  <button class="active" onclick="window.__setView && window.__setView('desktop')">Desktop</button>
  <button onclick="window.__setView && window.__setView('mobile')">Mobile</button>
</div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="ornaments.jsx"></script>
<script type="text/babel" src="shell.jsx"></script>
<script type="text/babel" src="hall.jsx"></script>
<script type="text/babel" src="rooms.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="mobile.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
